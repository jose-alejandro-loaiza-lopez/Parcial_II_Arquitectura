<section class="container my-3">
  <h3 class="mb-3">Microfrontend de Películas</h3>

  <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
    <button type="button" class="btn btn-primary" (click)="loadAll()">
      <i class="bi bi-list-ul"></i> Listar todas
    </button>

    <div class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label mb-1" for="movieId">Buscar por Id</label>
        <input
          id="movieId"
          type="number"
          min="1"
          class="form-control"
          [(ngModel)]="movieId" />
      </div>
      <button type="button" class="btn btn-secondary" (click)="loadById()">
        <i class="bi bi-search"></i> Buscar
      </button>
    </div>

    <div class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label mb-1" for="genre">Filtrar por Género</label>
        <select
          id="genre"
          class="form-select"
          [(ngModel)]="genre">
          @for (gen of genres; track gen) {
            <option [ngValue]="gen">{{ gen }}</option>
          }
        </select>
      </div>
      <button type="button" class="btn btn-success" (click)="loadByGenre()">
        <i class="bi bi-funnel"></i> Filtrar
      </button>
    </div>
  </div>

  @switch (state) {
    @case ('loading') {
      <app-alert alertState="loading" text="Cargando Películas..."></app-alert>
    }
    @case ('error') {
      <app-alert alertState="error" text="Error al Cargar las Películas"></app-alert>
    }
    @case ('success') {
      <app-movies-table [movies]="movies"></app-movies-table>
    }
  }
</section>
