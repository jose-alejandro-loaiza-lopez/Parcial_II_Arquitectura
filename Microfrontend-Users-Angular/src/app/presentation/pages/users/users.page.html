<section class="container my-3">
  <h3 class="mb-3">Microfrontend de Usuarios</h3>

  <div class="d-flex flex-wrap gap-3 align-items-end mb-3">
    <button type="button" class="btn btn-primary" (click)="loadAll()">
      <i class="bi bi-list-ul"></i> Listar todos
    </button>

    <div class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label mb-1" for="userId">Buscar por Id</label>
        <input
          id="userId"
          type="number"
          min="1"
          class="form-control"
          [(ngModel)]="userId" />
      </div>
      <button type="button" class="btn btn-secondary" (click)="loadById()">
        <i class="bi bi-search"></i> Buscar
      </button>
    </div>

    <div class="d-flex gap-2 align-items-end">
      <div>
        <label class="form-label mb-1" for="engineering">Filtrar por Ingeniería</label>
        <select
          id="engineering"
          class="form-select"
          [(ngModel)]="engineering">
          @for (eng of engineerings; track eng) {
            <option [ngValue]="eng">{{ eng }}</option>
          }
        </select>
      </div>
      <button type="button" class="btn btn-success" (click)="loadByEngineering()">
        <i class="bi bi-funnel"></i> Filtrar
      </button>
    </div>
  </div>

  @switch (state) {
    @case ('loading') {
      <app-alert alertState="loading" text="Cargando Usuarios..."></app-alert>
    }
    @case ('error') {
      <app-alert alertState="error" text="Error al Cargar los Usuarios"></app-alert>
    }
    @case ('success') {
      <app-users-table [users]="users"></app-users-table>
    }
  }
</section>
